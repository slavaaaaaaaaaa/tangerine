# Rendered by tangerine install.py -- edit config.yaml / templates/, not this file.
# http-level bits + port 80 (ACME challenges and redirect to https)

# Only login POSTs count against the login limit.
map $request_method $tangerine_login_key { POST $binary_remote_addr; default ""; }
limit_req_zone $tangerine_login_key zone=tangerine_login:10m rate={{logins_per_minute}}r/m;
limit_req_zone $binary_remote_addr  zone=tangerine_all:10m   rate={{requests_per_second}}r/s;

# Archive pages/images are cacheable by the browser only; redirects and errors never.
map $status $tangerine_cc_status { 200 "private, max-age=86400"; 304 "private, max-age=86400"; default "no-store"; }
map $uri $tangerine_cc { ~^/_gate/ ""; default $tangerine_cc_status; }

upstream tangerine_app  { server {{app_listen}}; keepalive 16; }
upstream tangerine_gate { server {{gate_listen}}; keepalive 8; }
{{catch_all_http}}
server {
    listen 80;
    listen [::]:80;
    server_name {{domain}};
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
