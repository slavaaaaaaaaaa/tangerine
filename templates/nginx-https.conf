# Rendered by tangerine install.py -- edit config.yaml / templates/, not this file.
# HTTPS site; installed once the certificate exists.

# Lives here, not in tangerine-http.conf: $tangerine_user is defined by auth_request_set below,
# and the http conf is tested on its own before the certificate exists.
log_format tangerine '$time_iso8601 $remote_addr user=$tangerine_user "$request" $status '
                     '$body_bytes_sent "$http_user_agent" rt=$request_time';

{{catch_all_https}}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{domain}};

    ssl_certificate     {{ssl_certificate}};
    ssl_certificate_key {{ssl_certificate_key}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tangerine_tls:10m;

    access_log /var/log/nginx/tangerine.access.log tangerine;
    error_log  /var/log/nginx/tangerine.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $tangerine_cc always;

    limit_req zone=tangerine_all burst=400 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # nginx asks the gate about every request.
    location = /_gate/check {
        internal;
        proxy_pass http://tangerine_gate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /_gate/login {
        limit_req zone=tangerine_login burst=5 nodelay;
        proxy_pass http://tangerine_gate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /_gate/ {
        proxy_pass http://tangerine_gate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        auth_request /_gate/check;
        auth_request_set $tangerine_user $upstream_http_x_tangerine_user;
        error_page 401 = @login;

        proxy_pass http://tangerine_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;

        # Stream .zip bundles instead of spooling them to disk.
        proxy_buffers 256 4k;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;

{{logout_link}}    }

    location @login {
        return 302 /_gate/login?next=$request_uri;
    }
}
